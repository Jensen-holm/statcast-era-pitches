name: Update Statcast Data

on:
  schedule:
    # run every day during MLB season months at 12:00 PM ET
    - cron: '0 17 * 3-10 *'
  workflow_dispatch:

jobs:
  update_data:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to push commits
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        lfs: true  # Enable LFS checkout

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install Git LFS
      run: |
        git lfs install

    - name: Install Dependencies & Update
      run: |
        python -m pip install --upgrade pip
        pip install -r update_requirements.txt
        python -m update

    - name: Commit and push updated data
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add data/statcast_era_pitches.parquet
        git commit -m "Update Statcast data [automated]" || echo "No changes to commit"
        git push

  test_schema:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        lfs: true  # Enable LFS checkout

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install Dependencies & Test
      run: |
        python -m pip install --upgrade pip
        pip install -r all_requirements.txt
        pytest tests/test_schema.py
